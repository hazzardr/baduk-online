ansible_connection: ssh
ansible_python_interpreter: /usr/bin/python3

# Backend
baduk_port: 4000
# Public URL of the site; OAuth redirect URLs are built from it (BASE_URL)
baduk_base_url: https://play.baduk.online

# Database
postgres_user: baduk
postgres_password: "{{ vault_postgres_pass }}"
postgres_db: baduk
postgres_connection_string: "postgres://{{ postgres_user }}:{{ postgres_password }}@postgres:5432/{{ postgres_db }}?sslmode=disable"

# GitHub Container Registry (for pulling private images)
# vault_ghcr_username: GitHub username
# vault_ghcr_token: GitHub Personal Access Token with read:packages scope

# Google sign-in (OAuth client of type "Web application"). Its authorized redirect URI must be
# {{ baduk_base_url }}/api/v1/auth/google/callback.
google_client_id: "{{ vault_google_client_id }}"
google_client_secret: "{{ vault_google_client_secret }}"
# OGS sign-in (online-go.com OAuth application). Its redirect URIs must include
# {{ baduk_base_url }}/api/v1/auth/ogs/callback.
ogs_client_id: "{{ vault_ogs_client_id }}"
ogs_client_secret: "{{ vault_ogs_client_secret }}"

