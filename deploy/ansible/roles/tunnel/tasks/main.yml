---
# Cloudflare Tunnel: cloudflared makes an outbound connection to Cloudflare, which
# terminates TLS and forwards requests for cloudflared_hostnames to the backend.
# No inbound ports are opened. One-time tunnel setup is in deploy/README.md.

- name: Add the Cloudflare package repository
  become: true
  get_url:
    url: https://pkg.cloudflare.com/cloudflared.repo
    dest: /etc/yum.repos.d/cloudflared.repo
    mode: '0644'

- name: Install cloudflared
  become: true
  dnf:
    name: cloudflared
    state: present
  notify:
    - restart cloudflared

- name: Create cloudflared system user
  become: true
  user:
    name: cloudflared
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Ensure cloudflared config directory exists
  become: true
  file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: cloudflared
    mode: '0750'

- name: Deploy tunnel credentials
  become: true
  copy:
    content: "{{ cloudflared_credentials | to_json }}"
    dest: /etc/cloudflared/credentials.json
    owner: root
    group: cloudflared
    mode: '0640'
  no_log: true
  notify:
    - restart cloudflared

- name: Deploy tunnel config
  become: true
  template:
    src: config.yml.j2
    dest: /etc/cloudflared/config.yml
    owner: root
    group: cloudflared
    mode: '0640'
    validate: cloudflared tunnel --config %s ingress validate
  notify:
    - restart cloudflared

- name: Deploy cloudflared systemd service
  become: true
  template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd daemon
    - restart cloudflared

- name: Enable and start cloudflared
  become: true
  systemd:
    name: cloudflared
    enabled: true
    state: started
    daemon_reload: true

# Caddy used to proxy traffic and its socket held baduk_port, which the backend
# needs. Remove it from hosts deployed before the switch to Cloudflare Tunnel.
- name: Stop old Caddy units
  command: systemctl --user stop caddy.service caddy.socket
  register: caddy_stop
  changed_when: false
  failed_when: false

- name: Remove old Caddy files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - ~/.config/systemd/user/caddy.socket
    - ~/.config/containers/systemd/caddy.container
    - ~/.config/containers/systemd/caddy-config.volume
    - ~/.config/containers/systemd/caddy-data.volume
    - ~/.config/containers/systemd/baduk.network
    - ~/caddy_etc
  notify:
    - reload systemd user daemon
