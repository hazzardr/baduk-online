---
- name: Ensure systemd User Dir exists
  file:
    path: "~/.config/systemd/user"
    state: directory
    mode: '0755'
  
- name: Ensure user containers systemd directory exists
  file:
    path: "~/.config/containers/systemd"
    state: directory
    mode: '0700'
    
- name: Ensure Socket Configuration
  template:
    src: caddy.socket.j2
    dest: "~/.config/systemd/user/caddy.socket"
    mode: '0644'
  notify:
    - reload systemd user daemon
    - restart caddy socket

- name: Ensure caddy_etc directory exists
  file:
    path: "~/caddy_etc"
    state: directory
    mode: '0755'

- name: Check that the frontend has been built
  delegate_to: localhost
  become: no
  stat:
    path: "{{ frontend_dist_dir }}/index.html"
  register: frontend_dist

- name: Fail if the frontend has not been built
  fail:
    msg: "{{ frontend_dist_dir }} is missing. Run `pnpm build` in frontend/ before deploying."
  when: not frontend_dist.stat.exists

- name: Ensure frontend web root exists
  file:
    path: "{{ caddy_www_host_dir }}"
    state: directory
    mode: '0755'

- name: Deploy frontend static files
  copy:
    src: "{{ frontend_dist_dir }}/"
    dest: "{{ caddy_www_host_dir }}/"
    mode: preserve

- name: Deploy Caddy configuration
  template:
    src: Caddyfile.j2
    dest: "~/caddy_etc/Caddyfile"
    mode: '0644'
  become: no
  notify:
    - restart caddy

- name: Deploy Caddy network
  template:
    src: caddy.network.j2
    dest: "~/.config/containers/systemd/baduk.network"
    mode: '0600'
  notify:
    - reload systemd user daemon
    - restart caddy

- name: Deploy Caddy config volume
  template:
    src: caddy-config.volume.j2
    dest: "~/.config/containers/systemd/caddy-config.volume"
    mode: '0600'
  notify:
    - reload systemd user daemon
    - restart caddy

- name: Deploy Caddy data volume
  template:
    src: caddy-data.volume.j2
    dest: "~/.config/containers/systemd/caddy-data.volume"
    mode: '0600'
  notify:
    - reload systemd user daemon
    - restart caddy

- name: Deploy Caddy container
  template:
    src: caddy.container.j2
    dest: "~/.config/containers/systemd/caddy.container"
    mode: '0600'
  notify:
    - reload systemd user daemon
    - restart caddy

