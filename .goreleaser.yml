# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...
    # The frontend is embedded in the binary (see frontend_embed.go).
    - pnpm --dir frontend install --frozen-lockfile
    - pnpm --dir frontend build

builds:
  - binary: baduk
    tags:
      - embedfrontend
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin

archives:
  - formats: ["tar.gz"]
    # Must match the download URL in deploy/ansible/roles/service/tasks/main.yml
    # (baduk-linux-amd64.tar.gz, baduk-linux-arm64.tar.gz).
    name_template: "baduk-{{ .Os }}-{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: ["zip"]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
